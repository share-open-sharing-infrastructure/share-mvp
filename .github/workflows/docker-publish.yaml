name: Docker image

# Builds and (on push/tag/dispatch) publishes the official frontend image to GHCR (#628).
#
# No application env vars are passed to the build anywhere in this workflow: since #627 the app
# reads every config value at RUNTIME via `$env/dynamic/*`, so `npm run build` inside the image
# needs none, and one published image serves any AllerLeih instance.
#
# IMAGE_NAME is the explicit `ghcr.io/share-open-sharing-infrastructure/allerleih-frontend`
# rather than `ghcr.io/${{ github.repository }}` (which would resolve to
# `.../share-mvp`) — the repository is named `share-mvp` for historical reasons, but the image
# should be named after the product, symmetric to the backend's own
# `ghcr.io/share-open-sharing-infrastructure/allerleih-backend` (allerleih-backend#55).
#
# On pull requests this workflow only BUILDS (amd64-only, no push) as a fast Dockerfile-validity
# check; it pushes on `push` to `main`, on `v*.*.*` tags, and on manual dispatch.

env:
  IMAGE_NAME: ghcr.io/share-open-sharing-infrastructure/allerleih-frontend

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.event.pull_request.number || github.ref }}
  # Only the PR-validation build should be cancellable — cancelling a push-to-main run mid-build
  # would silently drop that commit's `type=sha` tag from GHCR (see #628 review).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    # Skip on fork PRs (mirrors the other PR workflows); still runs on manual dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # QEMU is only needed to cross-build the arm64 layer, which only happens on the publish
      # path — the PR validation build stays amd64-only and native, so it can skip this entirely.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No SLSA provenance attestation: it would add a second, unlisted manifest-list entry
          # that `docker run`/most local tooling doesn't need for a self-hosted image, and keeps
          # `docker image inspect` output simple for the self-hosting audience this image targets.
          provenance: false
